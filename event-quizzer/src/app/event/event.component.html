<div id="wrapper" class="divided">
    <section
        class="banner style1 fullscreen image-position-center">
        <div class="content">

            <ng-template [ngIf]="jsonData && jsonData.status === 'OK'">
                <h1><b style="color: blue;">{{jsonData.title}}</b></h1>
                <div [innerHTML]="jsonData.description"></div>
                <ng-template [ngIf]="apiSubmitResponse && apiSubmitResponse.apiResponseStatus === 'OK'">
                    <ng-template [ngIf]="apiSubmitResponse.data['attendance']">   
                        <b>                     
                        <div [innerHTML]="apiSubmitResponse.data['attendance'].message" style="color: red;" *ngIf="apiSubmitResponse.data['attendance'].type==='ERR'"></div>
                        <div [innerHTML]="apiSubmitResponse.data['attendance'].message" style="color: blue;" *ngIf="apiSubmitResponse.data['attendance'].type==='INFO'"></div>
                        <div [innerHTML]="apiSubmitResponse.data['attendance'].message" style="color: orange;" *ngIf="apiSubmitResponse.data['attendance'].type==='WARN'"></div>
                        </b>
                    </ng-template>
                    <!--<ng-template [ngIf]="apiSubmitResponse.data['attendance_date']">
                        <br />{{environmentLabels['date']}} {{apiSubmitResponse.data['attendance_date']}}
                    </ng-template>-->
                    <ng-template [ngIf]="apiSubmitResponse.data['attendance_user']">
                        <br /> <b>{{environmentLabels['event_frm_msg_welcome']}} {{apiSubmitResponse.data['attendance_user']}}</b>
                    </ng-template>
                </ng-template>

                <ng-template [ngIf]="!apiSubmitResponse">
                    <form action="" id="registerForm">
                        <table>
                            <tr>
                                <td>
                                    <label for="identity_card">ID:</label>
                                </td>
                                <td><input type="text" name="identity_card" id="identity_card" value="" required
                                        [(ngModel)]="mapParams['u_id']" />
                                    <label for="identity_card" style="color: red;">
                                        <div [innerHTML]="validationMessage"></div>
                                    </label>
                                </td>
                            </tr>
                        </table>

                        <div style="text-align: center;">
                            <ul class="actions fit">
                                <li>
                                    <a class="button icon solid fa-check"
                                        (click)="registration()">{{environmentLabels?.event_frm_btn_register}}</a>
                                </li>
                            </ul>
                        </div>
                    </form>
                </ng-template>
            </ng-template>
            <ng-template [ngIf]="jsonData && jsonData.status === 'ERR'">
                <b>
                    <div [innerHTML]="jsonData.uiMessage.message" style="color: red;" *ngIf="jsonData.uiMessage.type==='ERR'"></div>
                </b>
            </ng-template>
        </div>
        
        <ng-template [ngIf]="jsonData && jsonData.status === 'OK'">
            <div class="image fit">
                <img src="{{jsonData.imageUrl}}" alt="" style="object-fit: fill;" />
            </div>            
        </ng-template>
        


    </section>
</div>
