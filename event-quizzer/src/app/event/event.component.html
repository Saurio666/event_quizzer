<ng-template [ngIf]="jsonData && jsonData.status === 'OK'">
    <div id="wrapper" class="divided">
        <section
            class="banner style1 orient-left content-align-left image-position-right fullscreen onload-image-fade-in onload-content-fade-right">
            <div class="content">
                <h1>{{jsonData.title}}</h1>
                <p>{{jsonData.description}}</p>
                <ng-template [ngIf]="apiSubmitResponse && apiSubmitResponse.apiResponseStatus === 'OK'">
                    {{environmentLabels[apiSubmitResponse.data['attendance']]}}
                </ng-template>

                <ng-template [ngIf]="!apiSubmitResponse">
                    <form action="" id="registerForm">
                        <table>
                            <tr>
                                <td>
                                    <label for="identity_card">ID:</label>
                                </td>
                                <td><input type="text" name="identity_card" id="identity_card" value="" required
                                        [(ngModel)]="mapParams['u_id']" /></td>
                            </tr>
                        </table>

                        <div style="text-align: center;">
                            <ul class="actions fit">
                                <li>
                                    <a class="button icon solid fa-check"
                                        (click)="registration()">{{environmentLabels?.event_btn_register}}</a>
                                </li>
                            </ul>
                        </div>
                    </form>
                </ng-template>
            </div>
            <div class="image">
                <img src="https://html5up.net/uploads/demos/story/images/banner.jpg" alt="" />
            </div>
        </section>
    </div>
</ng-template>
